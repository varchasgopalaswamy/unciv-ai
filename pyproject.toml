[project]
name = "civ-agent"
version = "0.1.0"
description = "HTTPS game hosting and scheduled player services for Unciv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.12,<4"]
classifiers = ["Private :: Do Not Upload", "Operating System :: POSIX :: Linux"]

[project.scripts]
civ-agent = "civ_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pyrefly", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["vendor", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["src/civ_agent", "tests"]
search-path = ["src", "."]
python-version = "3.12"
python-platform = "linux"
