[project]
name = "civ-agent"
version = "0.1.0"
description = "HTTPS game hosting and scheduled player services for Unciv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "authlib>=1.9.4,<2",
    "cryptography>=50.0.1,<51",
    "filelock>=3.32.7,<4",
    "httpx2>=2.12,<3",
    "joserfc>=1.8,<2",
    "jsonpatch>=1.33,<2",
    "jsonschema>=4.25,<5",
    "logfire>=5.4,<6",
    "mcp>=2.2,<3",
    "openinference-instrumentation-pydantic-ai==0.1.32",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-proto>=1.45.1",
    "opentelemetry-sdk>=1.45,<2",
    "pydantic>=2.13.5,<3",
    "pydantic-ai-harness[codemode]==0.64.0",
    "pydantic-ai-slim[google,openai,openrouter]==2.64.0",
    "pydantic-monty==1.5.0",
    "rich>=14,<15",
    "sqlalchemy>=2.0,<3",
    "textual>=6,<7",
    "tomlkit>=0.13,<1",
]
classifiers = ["Private :: Do Not Upload", "Operating System :: POSIX :: Linux"]

[project.scripts]
civ-agent = "civ_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "playwright>=1.63.0",
    "pydantic-ai-slim[anthropic]==2.64.0",
    "pyrefly",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["vendor", "build", ".agents/skills"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["src/civ_agent", "tests", "scripts"]
search-path = ["src", "."]
python-version = "3.12"
python-platform = "linux"
