name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned engine checkout
        shell: bash
        run: |
          expected=$(git rev-parse HEAD:vendor/Unciv)
          actual=$(git -C vendor/Unciv rev-parse HEAD)
          test "$expected" = "$actual"
          git -C vendor/Unciv diff --exit-code
      - name: Test local launchers
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build and test
        run: ./gradlew --no-daemon engineInfo build
