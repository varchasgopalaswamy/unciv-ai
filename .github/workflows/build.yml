name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.7'
          python-version: '3.12'
          enable-cache: true
      - name: Install Python package and tools
        run: uv sync --locked
      - name: Verify pinned engine checkout
        shell: bash
        run: |
          expected=$(git rev-parse HEAD:vendor/Unciv)
          actual=$(git -C vendor/Unciv rev-parse HEAD)
          test "$expected" = "$actual"
          git -C vendor/Unciv diff --exit-code
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Check Python types
        run: uv run --locked pyrefly check
      - name: Test Python package
        run: uv run --locked pytest
      - name: Build and test
        run: ./gradlew --no-daemon engineInfo build
