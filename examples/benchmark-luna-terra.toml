# One ordinary game template. Batch generation supplies each input's master seed.
[game]
civilizations = ["Inca", "France", "Greece", "Arabia", "China", "Persia"]
randomize = true
map_seed = 19238721
map_type = "Pangaea"
map_size = "Medium"
city_states = 12
difficulty = "Prince"
speed = "Quick"

[agents]
provider = "openai"
model = "gpt-5.6-luna"
# Default effort; player/economy_model/military_model overrides still take precedence.
reasoning_effort = "medium"
communication_reasoning_effort = "medium"
review_interval = 10
strategy_guide = true
civilization_guide = true
decisions_enabled = true
decisions_backend = "jev"
decisions_effort_enabled = true
# Decisions chooses among these levels supported by the current model.
decisions_effort_levels = ["low", "medium", "high", "xhigh", "max"]
# Otherwise retain reasoning_effort (including the role's override).
decisions_effort_min_probability = 0.50
decisions_effort_min_margin = 0.15

[[players]]
name = "Unciv"
controller = "built_in_ai"

[[players]]
name = 'Luna1'

[[players]]
name = 'Luna2'
model = 'gpt-6-luna'

[[players]]
name = 'Luna3'
model = 'gpt-6-luna'

[[players]]
name = 'Terra1'
model = "gpt-5.6-terra"
[[players]]
name = 'Terra2'
model = "gpt-5.6-terra"

[limits]
turn_timeout = 3600
max_seconds = 6048000

[resources.controller]
memory_mib = 4096
cpus = 2
pids = 512

[resources.agent]
memory_mib = 2048
cpus = 1
pids = 256
