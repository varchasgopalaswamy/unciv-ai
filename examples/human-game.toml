[game]
master_seed = 953
civilizations = ["France", "Rome", "Greece", "Egypt"]
randomize = false # Set true to shuffle all players onto these civilizations.
# Optional overrides; omitted seeds are derived independently from master_seed.
# map_seed = 42
# starting_position_seed = 17
# assignment_seed = 7
map_type = "Pangaea"
map_size = "Small"
difficulty = "Prince"
speed = "Quick"
starting_era = "Ancient era"
city_states = 2
victories = ["Scientific", "Cultural", "Domination", "Diplomatic", "Time"]

[agents]
model = "gpt-6-luna"
reasoning_effort = "medium"
review_interval = 5
strategy_guide = false
fast = false

[[players]]
name = "Human"
controller = "human"

[[players]]
name = "Luna 1"
controller = "agent"

[[players]]
name = "Luna 2"
controller = "agent"
# Optional per-player overrides:
# model = "gpt-6-sol"
# reasoning_effort = "high"

[[players]]
name = "Unciv"
controller = "built_in_ai"

[limits]
turn_timeout = 3600
startup_timeout = 900
max_seconds = 604800
max_invocations = 10000
# max_turns defaults to the native game speed's turn limit plus one.
# Terminal model overloads retry from the saved turn up to 5 times, 30 seconds apart.
# model_capacity_retries = 5
# model_capacity_retry_delay = 30

[runtime]
browser_port = 0 # Allocate a free localhost port; game status prints the URL.
