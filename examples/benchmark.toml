# One ordinary game template; batch generate/start --games N chooses N independent games.
[game]
civilizations = ["Rome", "Greece", "France", "Egypt"]
randomize = true
master_seed = 42
map_size = "Small"
city_states = 2

[agents]
model = "gpt-6-luna"
reasoning_effort = "medium"

[[players]]
name = "Luna medium"
model = "gpt-6-luna"

[[players]]
name = "Sol medium"
model = "gpt-6-sol"

[[players]]
name = "Luna high"
model = "gpt-6-luna"
reasoning_effort = "high"

[[players]]
name = "Unciv"
controller = "built_in_ai"

[limits]
max_turns = 3 # Opening comparison; omit for full games.
turn_timeout = 3600
max_seconds = 604800

[resources.controller]
memory_mib = 4096
cpus = 2
pids = 512

[resources.agent]
memory_mib = 2048
cpus = 1
pids = 256
