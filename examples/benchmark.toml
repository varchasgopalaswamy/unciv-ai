# One ordinary game template. Batch generation supplies each input's master seed.
[game]
civilizations = ["Inca", "France", "Greece", "Arabia", "China", "Persia"]
randomize = true
map_type = "Pangaea"
map_size = "Medium"
city_states = 12
difficulty = "Prince"
speed = "Quick"

[agents]
provider = "openai"
model = "GPT-5.6-luna"
reasoning_effort = "max"
review_interval = 10
strategy_guide = true
# civilization_guide = true # Optional advice for the assigned benchmark civilization.

[[players]]
name = "Unciv"
controller = "built_in_ai"

[[players]]
name = "GPT-5.6-Luna"
model = "gpt-5.6-luna"

[[players]]
name = "GPT-5.6-Terra"
model = "gpt-5.6-terra"

[[players]]
name = "GPT-5.6-sol"
model = "gpt-5.6-sol"

#[[players]]
#name = "GPT-6-Astra"
#model = "gpt-6-astra"

[[players]]
name = "Nemotron3Super"
provider = "openrouter"
model = "nvidia/nemotron-3-super-120b-a12b:free"
