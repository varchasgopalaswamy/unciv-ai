# Configuration reference: https://prek.j178.dev/reference/configuration/
# Activate both stages with `prek install`.
# Run commit checks manually with `prek run --all-files`.
# Apply Kotlin formatting explicitly with `./gradlew spotlessApply`.
minimum_prek_version = "0.4.14"
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]
exclude = '(^vendor/|(^|/)(build|\.gradle|\.kotlin)/)'

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-yaml", stages = ["pre-commit"] },
    { id = "check-json", stages = ["pre-commit"] },
    { id = "check-toml", stages = ["pre-commit"] },
    { id = "check-merge-conflict", args = ["--assume-in-merge"], stages = ["pre-commit"] },
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], stages = ["pre-commit"] },
    { id = "end-of-file-fixer", stages = ["pre-commit"] },
    { id = "check-added-large-files", args = ["--maxkb=1024"], stages = ["pre-commit"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "kotlin-style"
name = "Kotlin formatting and style (Spotless + ktlint)"
entry = "./gradlew --console=plain spotlessCheck"
language = "system"
files = '(\.kts?$|^\.editorconfig$)'
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "python-lint"
name = "Python lint (Ruff)"
entry = "uv run --locked ruff check ."
language = "system"
files = '(^src/civ_agent/.*\.py$|^tests/.*\.py$|^pyproject\.toml$|^uv\.lock$)'
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "python-format"
name = "Python formatting (Ruff)"
entry = "uv run --locked ruff format --check ."
language = "system"
files = '(^src/civ_agent/.*\.py$|^tests/.*\.py$|^pyproject\.toml$|^uv\.lock$)'
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "python-types"
name = "Python types (Pyrefly)"
entry = "uv run --locked pyrefly check"
language = "system"
files = '(^src/civ_agent/.*\.py$|^tests/.*\.py$|^pyproject\.toml$|^uv\.lock$)'
pass_filenames = false
require_serial = true
